spring:
  application:
    name: consulta-service
  # cria a projeção na subida (schema.sql); o Postgres vem do compose.yaml deste serviço
  sql:
    init:
      mode: always
  kafka:
    # Kafka do ambiente de desenvolvimento (compose do processo-service); nos testes vem do Testcontainers
    bootstrap-servers: localhost:9092
    consumer:
      # o grupo guarda no Kafka até onde este serviço já leu: ao voltar de uma queda, continua dali
      group-id: consulta-service
      # grupo novo (ou offsets apagados) começa do primeiro evento do tópico: é assim que a projeção se reconstrói
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  webflux:
    problemdetails:
      enabled: true

server:
  port: 8081
