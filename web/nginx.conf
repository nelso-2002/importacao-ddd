# Só serve os arquivos da tela. As APIs são chamadas direto pelo navegador (localhost:8080 e :8081),
# e cada serviço libera esta origem via CORS: não há mais proxy aqui.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Angular é uma SPA: /processos/123 não existe como arquivo, então devolve o index.html e o roteador resolve
    location / {
        try_files $uri $uri/ /index.html;
    }
}
