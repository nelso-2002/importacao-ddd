spring:
  application:
    name: processo-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # quem emitiu: o iss do token tem de ser exatamente este (o Keycloak sempre assina como localhost:8180)
          issuer-uri: http://localhost:8180/realms/importacao
          # onde buscar as chaves públicas para conferir a assinatura (no Docker, o endereço interno: ver docker-compose.yml)
          jwk-set-uri: http://localhost:8180/realms/importacao/protocol/openid-connect/certs
          # para quem: o token tem de ter sido emitido para esta API (escopo importacao-api do realm)
          audiences: importacao-api
  kafka:
    producer:
      # chave e valor como texto: o valor é o JSON montado pelo PublicadorOutbox
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all e idempotência já são o padrão do cliente Kafka 3+; deixar explícito documenta a intenção
      acks: all
      properties:
        enable.idempotence: true
        # Kafka fora do ar: desistir em segundos, não em minutos. O publicador segura locks na outbox
        # enquanto espera, e a próxima rodada tenta de novo de qualquer jeito.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

seguranca:
  cors:
    # a tela Angular (ng serve em desenvolvimento, nginx no docker-compose); em outro ambiente, outra lista
    origens: http://localhost:4200
