# Faz em produção o que o proxy.conf.json faz no ng serve: para o navegador é tudo a mesma origem,
# então não há CORS. Os nomes processo-service e consulta-service são os serviços do docker-compose.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # escrita e histórico: /api/processos/... → processo-service:8080/processos/...
    location /api/processos {
        proxy_pass http://processo-service:8080/processos;
    }

    # leitura e stream SSE: /api/consultas/... → consulta-service:8081/consultas/...
    location /api/consultas {
        proxy_pass http://consulta-service:8081/consultas;
        # SSE: sem buffer (cada evento sai na hora), conexão longa e HTTP/1.1 sem "Connection: close"
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Angular é uma SPA: /processos/123 não existe como arquivo, então devolve o index.html e o roteador resolve
    location / {
        try_files $uri $uri/ /index.html;
    }
}
